[project]
name = "claude-code-tts"
dynamic = ["version"]
description = "Text-to-speech for Claude Code using Piper TTS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "JMO" }
]
keywords = ["tts", "claude", "piper", "text-to-speech", "voice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
claude-tts = "claude_code_tts.cli:main"
claude-tts-install = "claude_code_tts.install:main"

[project.urls]
Homepage = "https://github.com/melderan/claude-code-tts"
Repository = "https://github.com/melderan/claude-code-tts"
Issues = "https://github.com/melderan/claude-code-tts/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claude_code_tts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code_tts"]

[tool.hatch.build.targets.wheel.force-include]
"hooks" = "claude_code_tts/hooks"
"commands" = "claude_code_tts/commands"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["claude_code_tts"]

[tool.bumpversion]
current_version = "9.14.1"
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore: bump version to {new_version}"

[[tool.bumpversion.files]]
filename = "src/claude_code_tts/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
