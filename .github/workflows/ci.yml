# CI for claude-code-tts.
#
# Supply-chain rules, on purpose (tj-actions and trivy-action were compromised through mutable tags
# and over-privileged tokens):
#   - every action is pinned to a full commit SHA; the version is a comment for humans and Dependabot
#   - the default token is read-only; no job here writes anything
#   - checkout never persists credentials
#   - no pull_request_target, no secrets, nothing published from CI (releases are a separate,
#     signature-gated workflow)
#   - only GitHub-owned actions plus astral-sh/setup-uv, pinned
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"

jobs:
  lint-and-version:
    name: lint, typecheck, version, kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: install just (from PyPI through uv; no third-party action)
        run: uv tool install rust-just
      - name: lint
        run: just lint
      - name: typecheck
        run: just typecheck
      - name: version consistency
        run: just version
      - name: kit shims match hooks/
        run: |
          for f in speak-response.sh speak-intermediate.sh; do
            cmp hooks/$f kits/claude-tts/files/home/.claude/hooks/$f
          done
          python3 -c "import json; json.load(open('kits/claude-tts/files/home/.config/claude/claude-tts.json'))"

  test:
    name: pytest ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: install just
        run: uv tool install rust-just
      - name: pytest
        run: just PY=${{ matrix.python }} test

  package:
    name: build wheel, cold install, preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: install just
        run: uv tool install rust-just
      - name: build wheel, check contents, cold install, preflight (`just build`)
        run: just build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 7

  clean-install-e2e:
    name: clean Ubuntu container, real install, speech
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist
      - name: run the clean-machine test from the built wheel
        run: WHEEL="$(ls dist/*.whl)" tests/docker/run-clean-install-test.sh
